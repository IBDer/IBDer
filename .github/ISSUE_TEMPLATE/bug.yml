name: 缺陷报告
description: 应用行为与预期不符、崩溃、数据错误
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **不要粘贴任何真实健康信息。** 不要附含症状、药名、就诊记录的截图、日志或数据文件。
        需要举例时请用合成数据（例如「第 3 天，2 次」），不要写真实日期、药品与医院。
        涉及隐私或安全的问题请走 SECURITY 渠道，不要开 issue。
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 实际行为是什么
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 你预期发生什么
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开…
        2. 点击…
        3. 看到…
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: 设置页的版本号，或 commit SHA
    validations:
      required: true
  - type: dropdown
    id: env
    attributes:
      label: 运行环境
      options:
        - iOS 模拟器
        - 真机 iPhone
        - Mac（Designed for iPad）
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 贴之前请先确认日志里不含健康内容
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我没有粘贴真实或可识别的健康信息（AGENTS.md §4）
          required: true
        - label: 我已确认这不是 spec 问题——spec 在 openspec/，spec 变更请用「规范变更」模板
          required: true
