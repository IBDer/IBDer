name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Ten seconds on a Linux runner, so a broken document or spec is reported long before a
  # macOS runner becomes free. This job also gates the expensive one.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Documentation integrity
        run: python3 scripts/check-docs.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate the specs
        run: npx --yes @fission-ai/openspec@1.14.3 validate --all --strict

  build-and-test:
    needs: docs
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate the Xcode project
        id: detect
        run: |
          if [ -f project.yml ]; then
            brew install xcodegen
            xcodegen generate
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Generated IBDer.xcodeproj from project.yml."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No project.yml yet - skipping build."
          fi

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Lint (SwiftFormat / SwiftLint)
        if: steps.detect.outputs.exists == 'true'
        run: |
          if [ -f .swiftlint.yml ]; then
            brew install swiftlint swiftformat
            swiftformat --lint .
            swiftlint --strict
          else
            echo "No lint config yet - skipping."
          fi

      - name: Build
        if: steps.detect.outputs.exists == 'true'
        run: |
          xcodebuild build \
            -scheme IBDer \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        if: steps.detect.outputs.exists == 'true'
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme IBDer \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload results
        if: always() && steps.detect.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
