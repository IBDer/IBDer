name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect Xcode project
        id: detect
        run: |
          if ls *.xcodeproj *.xcworkspace >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Found Xcode project."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No Xcode project yet - skipping build (skeleton phase)."
          fi

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Lint (SwiftFormat / SwiftLint)
        if: steps.detect.outputs.exists == 'true'
        run: |
          if [ -f .swiftlint.yml ]; then
            brew install swiftlint swiftformat
            swiftformat --lint .
            swiftlint --strict
          else
            echo "No lint config yet - skipping."
          fi

      - name: Build
        if: steps.detect.outputs.exists == 'true'
        run: |
          xcodebuild build \
            -scheme IBDer \
            -destination 'platform=iOS Simulator,name=iPhone 17'

      - name: Test
        if: steps.detect.outputs.exists == 'true'
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme IBDer \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -resultBundlePath TestResults.xcresult

      - name: Upload results
        if: always() && steps.detect.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
