# Tooling enforces the style; people do not (docs/engineering/swift-style.md).
strict: true
line_length:
  warning: 120
  error: 140
  ignores_comments: false
disabled_rules:
  - todo
opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - empty_count
  - explicit_init
  - first_where
  - last_where
  - redundant_nil_coalescing
  - sorted_first_last
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition
force_unwrapping: error
implicitly_unwrapped_optional: error
identifier_name:
  min_length: 2
  excluded: [id, x, y, r, g, b, a]
type_name:
  min_length: 3
  max_length: 50
excluded:
  - IBDer.xcodeproj
  - .build
