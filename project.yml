# XcodeGen project definition. The .xcodeproj is generated, never committed:
#   xcodegen generate
# Declarative project files are diffable and reviewable; a .pbxproj is not (ADR-0013).
name: IBDer
options:
  bundleIdPrefix: org.ibder
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Signing is left to Xcode so the app can be installed on a real phone with a personal team.
    # CI passes CODE_SIGNING_ALLOWED=NO because a simulator build never signs anything.
    DEVELOPMENT_LANGUAGE: zh-Hans

packages:
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.19.0

targets:
  IBDer:
    type: application
    platform: iOS
    sources:
      - path: IBDer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.ibder.app
        PRODUCT_NAME: IBDer
        # One source of truth for the plist: build settings, not a generated file.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: IBDer
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
  IBDerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: IBDerTests
    dependencies:
      - target: IBDer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.ibder.app.tests
        GENERATE_INFOPLIST_FILE: YES
  IBDerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: IBDerUITests
    dependencies:
      - target: IBDer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.ibder.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: IBDer
  IBDerSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: IBDerSnapshotTests
    dependencies:
      - target: IBDer
      - package: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.ibder.app.snapshottests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  IBDer:
    build:
      targets:
        IBDer: all
        IBDerTests: [test]
        IBDerUITests: [test]
        IBDerSnapshotTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - IBDerTests
        - IBDerUITests
        - IBDerSnapshotTests
